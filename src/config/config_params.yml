line_edit:
  - type: "float"
    id: "alpha"
    label: "Alpha"
    default_value: 0.1
    step: 0.1
    max: 1.0
    min: 0.0
  - type: "float"
    id: "gamma"
    label: "Gamma"
    default_value: 0.6
    step: 0.1
    max: 1.0
    min: 0.0
  - type: "float"
    id: "epsilon"
    label: "Epsilon"
    default_value: 1.0
    step: 0.1
    max: 1.0
    min: 0.0
  - type: "float"
    id: "epsilon_decay"
    label: "Epsilon Decay"
    default_value: 0.995
    step: 0.005
    max: 1.0
    min: 0.0
  - type: "float"
    id: "epsilon_minimal"
    label: "Epsilon Minimal"
    default_value: 0.1
    step: 0.1
    max: 1.0
    min: 0.0
widgets:
  - type: "button"
    id: "start_btn"
    label: "Start"
  - type: "button"
    id: "stop_btn"
    label: "Stop"
  - type: "button"
    id: "save_btn"
    label: "Save"
plots:
  - type: "line"
    id: "reward_plot"
    title: "Reward"
    cols: ["Episode", "Reward"]
    default_value: [0, 0]
  - type: "line"
    id: "epsilon_plot"
    title: "Epsilon"
    cols: ["Episode", "Epsilon"]
    default_value: [0, 0]
